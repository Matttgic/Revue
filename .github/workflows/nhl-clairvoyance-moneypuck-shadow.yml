name: Revue - Clairvoyance NHL MoneyPuck Shadow
on:
  workflow_dispatch:
  schedule:
    - cron: '20 07,17 * * *'
  push:
    paths:
      - 'outils/clairvoyance_nhl_moneypuck_shadow.py'
      - 'outils/nhl_shadow_tracker.py'
      - 'outils/nhl_moneypuck_prudent.py'
      - 'tests/test_clairvoyance_nhl_moneypuck_shadow.py'
      - 'tests/test_nhl_shadow_tracker.py'
      - 'tests/test_nhl_moneypuck_prudent.py'
      - '.github/workflows/nhl-clairvoyance-moneypuck-shadow.yml'

permissions:
  contents: write

concurrency:
  group: revue-nhl-clairvoyance-shadow
  cancel-in-progress: false

jobs:
  source-backed-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test original formula and strict no-leakage source bridge
        run: |
          python -m unittest discover -s tests -p 'test_clairvoyance_nhl_moneypuck_shadow.py' -v
          python -m unittest discover -s tests -p 'test_clairvoyance_model_reproduction.py' -v
          python -m unittest discover -s tests -p 'test_nhl_shadow_tracker.py' -v
          python -m unittest discover -s tests -p 'test_nhl_moneypuck_prudent.py' -v
          python -m outils.verifier_integrite_moneypuck
      - name: Check required MoneyPuck publications
        run: |
          test -s docs/moneypuck-nhl-latest.json
          test -s docs/moneypuck-goalies-latest.json
          python -m outils.verifier_integrite_moneypuck
      - name: Refresh from newest protected ledger and publish NHL forecasts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # On concurrent push, discard stale locally generated JSON and calculate
          # again against the newest remote ledger. Never rebase conflicting
          # predictions or overwrite frozen pre-game locks.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python -m outils.verifier_integrite_moneypuck
            python -m outils.clairvoyance_nhl_moneypuck_shadow --days 3
            git add docs/nhl-clairvoyance-shadow-latest.json docs/nhl-shadow-ledger.json docs/nhl-shadow-performance.json
            if git diff --cached --quiet; then
              echo "No changed shadow model output"
              exit 0
            fi
            git commit -m "data(nhl): refresh MoneyPuck-backed Clairvoyance formula SHADOW"
            if git push origin HEAD:main; then exit 0; fi
            echo "Concurrent update detected; rebuilding from latest immutable ledger (attempt $attempt)"
            sleep "$attempt"
          done
          exit 1
