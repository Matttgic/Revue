name: Revue - Source input NHL gap study
on:
  workflow_dispatch:
  schedule:
    - cron: '40 12 * * *'
  push:
    paths:
      - 'outils/nhl_source_input_gap.py'
      - 'tests/test_nhl_source_input_gap.py'
      - '.github/workflows/nhl-source-input-gap.yml'
permissions:
  contents: write
concurrency:
  group: revue-source-input-gap
  cancel-in-progress: false
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate comparator and NHL model source formula
        run: |
          python -m unittest discover -s tests -p 'test_nhl_source_input_gap.py' -v
          python -m unittest discover -s tests -p 'test_clairvoyance_model_reproduction.py' -v
      - name: Independently refresh research-only source-input diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python -m outils.nhl_source_input_gap
            git add docs/nhl-source-input-delta.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(nhl): quantify source input definition differences'
            if git push origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          exit 1
