name: Revue - NHL ESPN gardiens observes
on:
  workflow_dispatch:
  schedule:
    - cron: '10 1,7,13,19 * * *'
  workflow_run:
    workflows:
      - 'Revue - NHL frontend MC et Ensemble observes'
    types: [completed]
  push:
    paths:
      - 'outils/collecte/nhl_espn_goalies.py'
      - 'tests/test_nhl_espn_goalies.py'
      - '.github/workflows/nhl-espn-goalies.yml'
permissions:
  contents: write
concurrency:
  group: revue-nhl-espn-goalie-observations
  cancel-in-progress: false
jobs:
  observe-only:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate ESPN status classification and never assume starter
        run: |
          python -m unittest discover -s tests -p 'test_nhl_espn_goalies.py' -v
      - name: Observe up to four public scoreboards, without any odds API calls
        env:
          ODDS_API_KEY: ''
          PULSESCORE_API_KEY: ''
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python -m unittest discover -s tests -p 'test_nhl_espn_goalies.py'
            python -m outils.collecte.nhl_espn_goalies
            git add docs/nhl-espn-goalies-latest.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(nhl): observe ESPN confirmed or projected goalies with explicit missing statuses'
            if git push origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          exit 1
