name: Revue - Statistiques NHL officielles

on:
  workflow_dispatch:
  schedule:
    - cron: '24 8,14,20 * * *'
  push:
    paths:
      - 'outils/nhl_official_stats_revue.py'
      - 'tests/test_nhl_official_stats_revue.py'
      - '.github/workflows/nhl-official-stats.yml'

permissions:
  contents: write

concurrency:
  group: revue-official-nhl-stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test strict NHL source parsing (no mock used in production)
        run: python -m unittest discover -s tests -p 'test_nhl_official_stats_revue.py' -v
      - name: Collect official NHL regular-season statistics
        run: python -m outils.nhl_official_stats_revue --season 20262027
      - name: Verify nonempty actual source and publish timestamped snapshot
        run: |
          python - <<'PY'
          import json
          d=json.load(open('docs/nhl-official-stats-latest.json'))
          assert d['status']=='verified_nhl_official_stats_snapshot'
          assert len(d['teams'])>=25
          assert d['source']=='api.nhle.com/stats/rest/en'
          assert d['season']=='20262027'
          assert all(isinstance(r['team_id'],int) for r in d['teams'])
          assert not any(r.get('confirmed_starter') is True for r in d['goalies'])
          print('Verified official NHL:',len(d['teams']),'teams,',len(d['goalies']),'goalies,',len(d['skaters']),'skaters')
          PY
      - name: Publish observed statistics without overwriting concurrent commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/nhl-official-stats-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(nhl): refresh independently observed official NHL season stats"
          for attempt in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          exit 1
