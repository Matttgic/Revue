name: Revue - Phase 4 Source outputs
on:
  workflow_dispatch:
  schedule:
    - cron: '38 0,6,12,18 * * *'
  workflow_run:
    workflows:
      - 'Revue - Sorties reelles Clairvoyance'
      - 'Revue - NHL backend source-style audits'
    types: [completed]
  push:
    paths:
      - 'outils/clairvoyance/phase4_parite_reelle.py'
      - 'tests/test_phase4_parite_reelle.py'
      - 'docs/phase4-parite.html'
      - '.github/workflows/phase4-parite-reelle.yml'
permissions:
  contents: write
concurrency:
  group: revue-phase4-parity
  cancel-in-progress: false
jobs:
  audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test anti-backfill and no false parity
        run: |
          python -m unittest discover -s tests -p 'test_phase4_parite_reelle.py' -v
          python -m unittest discover -s tests -p 'test_clairvoyance_real_output_gap.py' -v
      - name: Recompute source evidence without premium API calls
        run: python -m outils.clairvoyance.phase4_parite_reelle
      - name: Publish report only, never change frozen predictions or ledgers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python -m outils.clairvoyance.phase4_parite_reelle
            git add docs/phase4-evidence-latest.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(phase4): publish source output parity evidence without ROI claims'
            if git push origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          exit 1
