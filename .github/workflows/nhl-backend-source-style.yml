name: Revue - NHL backend source-style audits
on:
  workflow_dispatch:
  schedule:
    - cron: '15 14 * * 1'  # Audit Clairvoyance hebdomadaire (lundi) : le source ne change pas au jour le jour.
  push:
    branches: [main]
    paths:
      - 'outils/clairvoyance/nhl_backend_source_style.py'
      - 'tests/test_nhl_backend_source_style.py'
      - 'docs/nhl-backend-source-style.html'
      - '.github/workflows/nhl-backend-source-style.yml'
permissions:
  contents: write
concurrency:
  group: revue-nhl-backend-source-style
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify independent NHL math and prevent future-data leakage
        run: |
          python -m unittest discover -s tests -p 'test_nhl_backend_source_style.py' -v
          python -m unittest discover -s tests -p 'test_nhl_source_input_gap.py' -v
          python -m unittest discover -s tests -p 'test_clairvoyance_model_reproduction.py' -v
      - name: Rebuild from the latest known source observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python -m outils.clairvoyance.nhl_backend_source_style --out docs/nhl-backend-source-style-latest.json
            git add docs/nhl-backend-source-style-latest.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "data(nhl): publish source-style input scenarios without altering frozen picks"
            if git push origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          exit 1
