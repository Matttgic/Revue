name: Revue - Test API Vercel public
on:
  workflow_dispatch:
  push:
    paths:
      - 'api_revue/**'
      - 'api/index.py'
      - 'requirements.txt'
      - 'vercel.json'
      - '.github/workflows/api-vercel-smoke.yml'
  schedule:
    - cron: '15 8 * * *'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify public Vercel API health and actual JSON content
        run: |
          python - <<'PY'
          from urllib.request import urlopen
          from urllib.error import HTTPError,URLError
          import json
          from datetime import datetime,timezone
          from zoneinfo import ZoneInfo
          base="https://revue-api-tawny.vercel.app"
          local_day=datetime.now(ZoneInfo("Europe/Paris")).date().isoformat()
          routes=(
              "/health","/revue/parity",
              f"/nhl/schedule?game_date={local_day}",
              "/nhl/teams","/nhl/goalies?min_games=1",
              "/nhl/skaters?team=ANA","/nhl/moneypuck?situation=all",
          )
          for route in routes:
              try:
                  with urlopen(base+route,timeout=15) as resp:
                      status=resp.status
                      data=json.load(resp)
              except HTTPError as exc:
                  raise SystemExit(f"{route}: HTTP {exc.code}; public API not ready")
              except (URLError,ValueError) as exc:
                  raise SystemExit(f"{route}: source unavailable ({type(exc).__name__})")
              print(route,"status",status,"json-kind",type(data).__name__)
              assert status==200
              if route=="/health":
                  assert data=={"status":"ok"}
              elif route=="/revue/parity":
                  assert data["exact_end_to_end_parity"]=="NOT_VERIFIED"
                  assert data["exact_reproduction_percent"] is None
              elif route.startswith("/nhl/schedule"):
                  assert isinstance(data,list)
                  assert all(r.get("espn_id") and r.get("home_moneyline") is None for r in data)
                  assert all(str(row["espn_id"]).startswith("401") for row in data)
                  if local_day=="2026-10-10":
                      assert any(str(row["espn_id"])=="401892469" for row in data)
                  print("Real ESPN identifiers verified:",len(data))
              elif route=="/nhl/teams":
                  assert isinstance(data,list) and len(data)>=25
                  assert all(type(r.get("wins")) is int and r.get("team_id") for r in data)
              elif route.startswith("/nhl/goalies"):
                  assert isinstance(data,list) and len(data)>=20
                  assert all(type(r.get("player_id")) is int for r in data)
                  assert all(0<=r["overall_save_pct"]<=1 for r in data
                             if r.get("overall_save_pct") is not None)
              elif route.startswith("/nhl/skaters"):
                  assert isinstance(data,list) and len(data)>=8
                  assert all(r["team_abbrev"]=="ANA" for r in data)
              else:
                  assert isinstance(data,list) and len(data)>=25
                  assert all(r["situation"]=="all" and 0<=r["x_goals_pct"]<=1
                             for r in data)
                  assert all(r.get("goals_for") is None for r in data)
              if route.startswith("/nhl/") and not route.startswith("/nhl/schedule"):
                  print("Verified NHL API rows:",len(data))
          PY
