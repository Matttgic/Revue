name: Revue - Test API Vercel public
on:
  workflow_dispatch:
  push:
    paths:
      - 'api_revue/**'
      - 'api/index.py'
      - 'requirements.txt'
      - 'vercel.json'
      - '.github/workflows/api-vercel-smoke.yml'
  schedule:
    - cron: '15 8 * * *'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify public Vercel API health and actual JSON content
        run: |
          python - <<'PY'
          from urllib.request import urlopen
          from urllib.error import HTTPError,URLError
          import json
          from datetime import datetime,timezone
          from zoneinfo import ZoneInfo
          base="https://revue-api-tawny.vercel.app"
          local_day=datetime.now(ZoneInfo("Europe/Paris")).date().isoformat()
          routes=(
              "/health","/revue/parity",
              f"/nhl/schedule?game_date={local_day}",
              "/nhl/teams","/nhl/goalies?min_games=1",
              "/nhl/skaters?team=ANA","/nhl/moneypuck?situation=all",
              "/nhl/moneypuck/live","/mlb/elo",
          )
          for route in routes:
              try:
                  with urlopen(base+route,timeout=15) as resp:
                      status=resp.status
                      data=json.load(resp)
              except HTTPError as exc:
                  raise SystemExit(f"{route}: HTTP {exc.code}; public API not ready")
              except (URLError,ValueError) as exc:
                  raise SystemExit(f"{route}: source unavailable ({type(exc).__name__})")
              print(route,"status",status,"json-kind",type(data).__name__)
              assert status==200
              if route=="/health":
                  assert data=={"status":"ok"}
              elif route=="/revue/parity":
                  assert data["exact_end_to_end_parity"]=="NOT_VERIFIED"
                  assert data["exact_reproduction_percent"] is None
              elif route.startswith("/nhl/schedule"):
                  assert isinstance(data,list)
                  assert all(r.get("espn_id") and r.get("home_moneyline") is None for r in data)
                  assert all(str(row["espn_id"]).startswith("401") for row in data)
                  if local_day=="2026-10-10":
                      assert any(str(row["espn_id"])=="401892469" for row in data)
                  print("Real ESPN identifiers verified:",len(data))
              elif route=="/mlb/elo":
                  assert isinstance(data,list) and len(data)>=25
                  assert all(set(row)=={"team","rating","games_played","last_game_date"} for row in data)
                  assert all(1300 < row["rating"] < 1700 and row["games_played"]>0 for row in data)
                  assert len({row["team"] for row in data}) == len(data)
                  print("Verified source-scoped MLB Elo teams:",len(data))
              elif route=="/nhl/teams":
                  assert isinstance(data,list) and len(data)>=25
                  assert all(type(r.get("wins")) is int and r.get("team_id") for r in data)
              elif route.startswith("/nhl/goalies"):
                  assert isinstance(data,list) and len(data)>=20
                  assert all(type(r.get("player_id")) is int for r in data)
                  assert all(0<=r["overall_save_pct"]<=1 for r in data
                             if r.get("overall_save_pct") is not None)
              elif route=="/nhl/moneypuck/live":
                  assert isinstance(data,dict)
                  assert data.get("source")=="moneypuck.com"
                  assert data.get("revue_reproduction_status","").startswith("partial")
                  assert data.get("confirmed_starting_goalies") is False
                  assert len(data.get("teams",{}))>=20 and len(data.get("goalies",[]))>=20
              elif route.startswith("/nhl/skaters"):
                  assert isinstance(data,list) and len(data)>=8
                  assert all(r["team_abbrev"]=="ANA" for r in data)
                  assert all(type(r.get("player_id")) is int for r in data)
                  assert all(type(r.get("shots_wrist")) is int for r in data)
                  assert any(r["shots_wrist"]>0 for r in data)
              else:
                  assert isinstance(data,list) and len(data)>=25
                  assert all(r["situation"]=="all" and 0<=r["x_goals_pct"]<=1
                             for r in data)
                  assert all(r.get("goals_for") is None for r in data)
              if route.startswith("/nhl/") and not route.startswith("/nhl/schedule"):
                  print("Verified NHL API rows:",len(data))
          # The source /predictions/ remains unavailable until original
          # bookmaker, SQL and goalie inputs can be verified. The separate
          # Revue endpoint may serve *research-only* forecasts on active days.
          with urlopen(base+"/openapi.json",timeout=15) as resp:
              endpoints=json.load(resp)["paths"]
          assert "/revue/predictions" in endpoints
          assert "get" in endpoints["/revue/predictions"]
          assert "/predictions/" in endpoints
          from urllib.parse import urlencode
          from datetime import timedelta
          observed=0
          today=datetime.now(timezone.utc).date()
          for offset in (0,1,2):
              day=(today+timedelta(days=offset)).isoformat()
              url=base+"/revue/predictions?"+urlencode({"game_date":day})
              try:
                  with urlopen(url,timeout=15) as resp:
                      assert resp.status==200
                      result=json.load(resp)
                  assert result["status"]=="revue_research_same_formula_not_original_source_inputs"
                  assert result["source_input_parity_with_original"] is False
                  assert result["not_original_predictions_endpoint"] is True
                  assert result["real_bets_enabled"] is False
                  assert result["count"]>0
                  assert all(x["formula_result"]["market_home_ml"] is None
                             and x["formula_result"]["recommendation"] is None
                             and x["pick_recommendation_verified"] is False
                             for x in result["predictions"])
                  observed += result["count"]
                  print("Research-only future verified fixtures:",day,result["count"])
                  break
              except HTTPError as exc:
                  if exc.code!=503:
                      raise
                  print("No valid research predictions for",day,"(explicit HTTP 503)")
          print("Prospective research route verified; currently available:",observed)
          PY
