name: Revue - Probe NBA ESPN Prior Season
on:
  workflow_dispatch:
  push:
    paths:
      - 'outils/probe_nba_espn_standings.py'
      - '.github/workflows/probe-nba-standings.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tester les standings de la saison NBA 2025-26
        run: python -m outils.probe_nba_espn_standings
