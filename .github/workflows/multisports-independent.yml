name: Revue - Multisports Independent
on:
  workflow_dispatch:
  schedule:
    - cron: "30 5,11,17,23 * * *"
  push:
    paths:
      - 'modeles/simulations/multisports_independant.py'
      - 'tests/test_multisports_independant.py'
      - 'modeles/simulations/sports_individuels_et_liiga.py'
      - 'tests/test_sports_individuels_et_liiga.py'
      - 'modeles/simulations/nhl_joueurs_independant.py'
      - 'tests/test_nhl_joueurs_independant.py'
      - 'outils/probe_espn_hockey.py'
      - 'outils/backtest_multisports.py'
      - 'tests/test_backtest_multisports.py'
      - 'modeles/simulations/football_avance_independant.py'
      - 'tests/test_football_avance_independant.py'
      - 'modeles/simulations/football_espn_statistiques.py'
      - 'tests/test_football_espn_statistiques.py'
      - 'outils/suivi_football_avance.py'
      - 'tests/test_suivi_football_avance.py'
      - 'modeles/simulations/equipes_avance_multisports.py'
      - 'tests/test_equipes_avance_multisports.py'
      - 'modeles/simulations/ensemble_montecarlo_bayes.py'
      - 'tests/test_ensemble_montecarlo_bayes.py'
      - 'outils/suivi_ensemble.py'
      - 'tests/test_suivi_ensemble.py'
      - '.github/workflows/multisports-independent.yml'

permissions:
  contents: write

concurrency:
  group: revue-multisports
  cancel-in-progress: false

jobs:
  multisports:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests hors réseau
        run: python -m unittest discover -s tests -p 'test_multisports_independant.py' -v
      - name: Mettre à jour NHL depuis API officielle
        run: python modeles/simulations/nhl_independant.py --days 3 --output docs/nhl-model-latest.json
        continue-on-error: true
      - name: Tester le modèle des joueurs NHL
        run: python -m unittest discover -s tests -p 'test_nhl_joueurs_independant.py' -v
      - name: Calculer les profils buteurs, passeurs et tirs NHL
        run: python modeles/simulations/nhl_joueurs_independant.py --nhl-file docs/nhl-model-latest.json
      - name: Tester tennis UFC Liiga sans réseau
        run: python -m unittest discover -s tests -p 'test_sports_individuels_et_liiga.py' -v
      - name: Tennis UFC Liiga depuis données réelles
        run: python modeles/simulations/sports_individuels_et_liiga.py --days 3 --output docs/individual-latest.json
      - name: Calculer toutes les compétitions disponibles
        run: python modeles/simulations/multisports_independant.py --days 3 --output docs/multisports-latest.json
      - name: Tests du collecteur stats football ESPN
        run: python -m unittest discover -s tests -p 'test_football_espn_statistiques.py' -v
      - name: Enrichir les statistiques de matchs ESPN
        run: python -m modeles.simulations.football_espn_statistiques --history docs/multisports-history.json --cache docs/football-espn-stat-cache.json --output docs/football-espn-team-features.json --max-calls 24
      - name: Tests football avancé autonome et fuite temporelle
        run: python -m unittest discover -s tests -p 'test_football_avance_independant.py' -v
      - name: Prévisions football enrichies en parallèle (aucun lock)
        run: python modeles/simulations/football_avance_independant.py --cache docs/multisports-history.json --output docs/football-advanced-shadow.json
      - name: Tests suivi football prospectif anti-fuite
        run: python -m unittest discover -s tests -p 'test_suivi_football_avance.py' -v
      - name: Enregistrer prévisions football avant le coup d'envoi et régler les anciennes
        run: python -m outils.suivi_football_avance
      - name: Tester modèles équipes avancés NBA NFL NCAA MLB
        run: python -m unittest discover -s tests -p 'test_equipes_avance_multisports.py' -v
      - name: Comparer les modèles avancés des équipes (shadow uniquement)
        run: python -m modeles.simulations.equipes_avance_multisports --history docs/multisports-history.json --output docs/equipes-avance-shadow.json
      - name: Tester ensemble Monte Carlo Bayes Elo chronologique
        run: python -m unittest discover -s tests -p 'test_ensemble_montecarlo_bayes.py' -v
      - name: Générer ensemble Monte Carlo Bayes Elo en mode SHADOW
        run: python -m modeles.simulations.ensemble_montecarlo_bayes --history docs/multisports-history.json --output docs/ensemble-mc-bayes-latest.json
      - name: Tester suivi prospectif ensemble sans cotes
        run: python -m unittest discover -s tests -p 'test_suivi_ensemble.py' -v
      - name: Enregistrer prévisions ensemble pre-match et scores vérifiés
        run: python -m outils.suivi_ensemble
      - name: Tests du backtest chronologique
        run: python -m unittest discover -s tests -p 'test_backtest_multisports.py' -v
      - name: Brier et log loss historiques par compétition
        run: python outils/backtest_multisports.py --history docs/multisports-history.json --output docs/backtests-multisports.json
      - name: Enregistrer uniquement les prédictions calculées
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/nhl-model-latest.json docs/multisports-latest.json docs/multisports-history.json docs/individual-latest.json docs/individual-history.json docs/nhl-players-latest.json docs/backtests-multisports.json docs/football-advanced-shadow.json docs/football-espn-stat-cache.json docs/football-espn-team-features.json docs/football-shadow-ledger.json docs/football-shadow-performance.json docs/equipes-avance-shadow.json docs/ensemble-mc-bayes-latest.json docs/ensemble-mc-bayes-ledger.json docs/ensemble-mc-bayes-performance.json
          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "data: rafraîchir toutes les prédictions multisports"
            # Prefer the freshly generated JSON if another run published between checkout and push.
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi
