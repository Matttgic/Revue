name: Revue - Diagnostic NHL entrees originales
on:
  workflow_dispatch:
  schedule:
    - cron: '51 5,11,17,23 * * *'
  workflow_run:
    workflows:
      - 'Revue - Sorties reelles Clairvoyance'
    types: [completed]
  push:
    paths:
      - 'outils/clairvoyance_nhl_forensics.py'
      - 'tests/test_clairvoyance_nhl_forensics.py'
      - 'outils/clairvoyance_nhl_scenarios.py'
      - 'tests/test_clairvoyance_nhl_scenarios.py'
      - '.github/workflows/clairvoyance-nhl-forensics.yml'
permissions:
  contents: write
concurrency:
  group: revue-source-nhl-forensics
  cancel-in-progress: false
jobs:
  diagnostics:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests unitaires - xG source, chronologie, doublons, probabilités répétées
        run: python -m unittest discover -s tests -p 'test_clairvoyance_nhl_forensics.py' -v
      - name: Vérifier aussi la sensibilité des entrées Elo et gardiens sur formule originale reconstruite
        run: python -m unittest discover -s tests -p 'test_clairvoyance_nhl_scenarios.py' -v
      - name: Vérifier les entrées MoneyPuck 5v5 et écarts sur vrais matchs NHL
        run: |
          python -m outils.clairvoyance_nhl_forensics
          python -m outils.clairvoyance_nhl_scenarios
      - name: Enregistrer seulement diagnostic dérivé - jamais code ni historique original
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python -m outils.clairvoyance_nhl_forensics
            python -m outils.clairvoyance_nhl_scenarios
            git add docs/clairvoyance-nhl-forensics.json docs/clairvoyance-nhl-scenarios.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(parity): publish NHL real-input xG, market and default-probability gap forensics'
            if git push origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          exit 1
