name: Revue - NHL Monte Carlo Ensemble prospective
on:
  workflow_dispatch:
  schedule:
    - cron: '25 0,4,8,12,16,20 * * *'
  workflow_run:
    workflows:
      - 'Revue - NHL frontend MC et Ensemble observes'
      - 'Revue - NHL official results only'
    types: [completed]
  push:
    paths:
      - 'outils/nhl_frontend_tracker.py'
      - 'tests/test_nhl_frontend_tracker.py'
      - '.github/workflows/nhl-frontend-prospective.yml'
permissions:
  contents: write
concurrency:
  group: revue-nhl-frontend-prospective
  cancel-in-progress: false
jobs:
  lock-and-settle:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify prematch locking, NHL official settlement and no hindsight
        run: |
          python -m unittest discover -s tests -p 'test_nhl_frontend_tracker.py' -v
          python -m unittest discover -s tests -p 'test_nhl_settlement_officiel.py' -v
          python -m unittest discover -s tests -p 'test_nhl_shadow_tracker.py' -v
      - name: Save verifiably pre-match models and official NHL scores only
        env:
          ODDS_API_KEY: ''
          PULSESCORE_API_KEY: ''
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python -m unittest discover -s tests -p 'test_nhl_frontend_tracker.py'
            python -m outils.nhl_frontend_tracker
            if ! test -s docs/nhl-frontend-prospective-ledger.json; then
              echo "No qualifying genuine upcoming NHL predictions; never fabricate historical locks."
              exit 0
            fi
            git add docs/nhl-frontend-prospective-ledger.json docs/nhl-frontend-prospective-performance.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(nhl): lock immutable MC and Ensemble pregame probabilities and grade official finals'
            if git push origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          exit 1
