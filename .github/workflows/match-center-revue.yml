name: Revue - Match Center unifié
on:
  workflow_dispatch:
  schedule:
    - cron: '05 * * * *'
  workflow_run:
    workflows:
      - 'Revue - Multisports Independent'
      - 'Revue - Engine V2 (simulation)'
      - 'Revue - NHL frontend MC et Ensemble observes'
    types: [completed]
  push:
    paths:
      - 'outils/match_center_revue.py'
      - 'outils/phase10_modeles_multisports.py'
      - 'outils/phase10_validation_prospective.py'
      - 'outils/phase12_official_finals.py'
      - 'outils/phase12_audit.py'
      - 'tests/test_phase12_audit.py'
      - 'tests/test_phase12_site.py'
      - 'tests/test_phase12_official_finals.py'
      - 'tests/test_phase10_modeles_multisports.py'
      - 'tests/test_phase10_validation_prospective.py'
      - 'tests/test_phase10_modeles_site.py'
      - 'outils/scoreboard_revue.py'
      - 'outils/prospectif_multisports_revue.py'
      - 'outils/revue_match_dossiers.py'
      - 'tests/test_revue_match_dossiers.py'
      - 'tests/test_match_center_revue.py'
      - 'tests/test_scoreboard_revue.py'
      - 'tests/test_prospectif_multisports_revue.py'
      - '.github/workflows/match-center-revue.yml'
permissions:
  contents: write
concurrency:
  group: revue-match-center-hourly
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test model/market joins, missing data and regulatory filters
        run: |
          python -m unittest discover -s tests -p 'test_phase10_modeles_multisports.py' -v
          python -m unittest discover -s tests -p 'test_phase10_validation_prospective.py' -v
          python -m unittest discover -s tests -p 'test_phase12_official_finals.py' -v
          python -m unittest discover -s tests -p 'test_phase12_audit.py' -v
          python -m unittest discover -s tests -p 'test_phase12_site.py' -v
          python -m unittest discover -s tests -p 'test_phase10_modeles_site.py' -v
          python -m unittest discover -s tests -p 'test_match_center_revue.py' -v
          python -m unittest discover -s tests -p 'test_scoreboard_revue.py' -v
          python -m unittest discover -s tests -p 'test_prospectif_multisports_revue.py' -v
          python -m unittest discover -s tests -p 'test_revue_match_dossiers.py' -v
      - name: Recompute upcoming board against newest saved real feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            # Public scoreboards are best effort; a failing sports provider
            # must not block a fresh bookmakers/model dashboard.
            python -m outils.scoreboard_revue || echo 'Score source unavailable; no stale scores will be shown'
            # Model report uses prior known fixtures; each stage validates
            # kickoff, teams and source observation time before promotion.
            python -m outils.phase10_modeles_multisports
            python -m outils.match_center_revue
            python -m outils.prospectif_multisports_revue
            # Only download official finals for previously frozen due games,
            # including those outside the standard short ESPN scoreboard window.
            python -m outils.phase12_official_finals
            python -m outils.phase10_validation_prospective
            python -m outils.phase12_audit
            python -m outils.revue_match_dossiers
            git add docs/match-center-latest.json docs/multisport-prospective-ledger.json docs/multisport-prospective-performance.json docs/match-dossiers-latest.json
            git add docs/phase10-modeles-multisports-latest.json docs/phase10-modeles-prospectif-ledger.json docs/phase10-modeles-performance.json
            git add docs/phase12-official-finals-latest.json docs/phase12-reconciliation-latest.json docs/phase12-result-integrity-latest.json
            if test -f docs/scoreboard-revue-latest.json; then git add docs/scoreboard-revue-latest.json; fi
            if git diff --cached --quiet; then
              echo "No match-center change"
              exit 0
            fi
            git commit -m "data(match-center): publish strictly observed Revue fixtures and prices"
            if git push origin HEAD:main; then exit 0; fi
            echo "Concurrent branch update: rebuild from current source JSON"
            sleep "$attempt"
          done
          exit 1
