name: Revue - Parité exacte modèles Clairvoyance
on:
  workflow_dispatch:
  push:
    paths:
      - 'modeles/reproduction/clairvoyance_predictor.py'
      - 'modeles/reproduction/clairvoyance_nba_source.py'
      - 'outils/verifier_parite_nba_source.py'
      - 'outils/verifier_parite_clairvoyance.py'
      - 'outils/verifier_parite_predictor_nhl_observe.py'
      - 'tests/test_parite_predictor_nhl_observe.py'
      - 'outils/parite_calendrier_nhl_espn.py'
      - 'tests/test_parite_calendrier_nhl_espn.py'
      - 'tests/test_clairvoyance_model_reproduction.py'
      - 'outils/catalogue_parite_modeles.py'
      - 'modeles/reproduction/frontend_clairvoyance.js'
      - 'outils/verify_clairvoyance_frontend.js'
      - 'modeles/reproduction/frontend_clairvoyance_nhl.js'
      - 'outils/verify_clairvoyance_nhl.js'
      - 'modeles/reproduction/frontend_clairvoyance_soccer_xg.js'
      - 'outils/verify_clairvoyance_soccer_xg.js'
      - 'modeles/reproduction/frontend_clairvoyance_soccer_analytic.js'
      - 'outils/verify_clairvoyance_soccer_analytic.js'
      - 'modeles/reproduction/frontend_clairvoyance_euro_hockey.js'
      - 'outils/verify_clairvoyance_euro_hockey.js'
      - 'modeles/reproduction/frontend_clairvoyance_euro_hockey_games.js'
      - 'outils/verify_clairvoyance_euro_hockey_matches.js'
      - 'modeles/reproduction/frontend_clairvoyance_euro_hockey_ensemble.js'
      - 'outils/verify_clairvoyance_euro_hockey_ensemble.js'
      - 'outils/verify_clairvoyance_hockey_helpers.js'
      - 'modeles/reproduction/frontend_clairvoyance_hockey_market.js'
      - 'outils/verify_clairvoyance_hockey_market.js'
      - 'modeles/reproduction/frontend_clairvoyance_soccer_form.js'
      - 'outils/verify_clairvoyance_soccer_form.js'
      - 'modeles/reproduction/frontend_clairvoyance_soccer_fbref.js'
      - 'outils/verify_clairvoyance_soccer_fbref.js'
      - 'modeles/reproduction/frontend_clairvoyance_nhl_goalie_form.js'
      - 'outils/verify_clairvoyance_nhl_goalie_form.js'
      - 'modeles/reproduction/frontend_clairvoyance_player_line.js'
      - 'outils/verify_clairvoyance_player_line.js'
      - 'modeles/reproduction/frontend_clairvoyance_injury_impact.js'
      - 'outils/verify_clairvoyance_injury_impact.js'
      - 'modeles/reproduction/frontend_clairvoyance_nba_props.js'
      - 'outils/verify_clairvoyance_nba_props.js'
      - 'tests/test_catalogue_parite_modeles.py'
      - '.github/workflows/parite-clairvoyance-predictor.yml'
  # The original source changes; reevaluate pinned function parity every day.
  schedule:
    - cron: '20 8 * * *'
permissions:
  contents: write
concurrency:
  group: revue-parite-clairvoyance
  cancel-in-progress: false
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          path: revue
      - uses: actions/checkout@v4
        with:
          repository: Purple-Wraith/clairvoyance-backend
          path: clairvoyance_reference
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test original behaviour, offline (8 checks)
        working-directory: revue
        run: python -m unittest discover -s tests -p 'test_clairvoyance_model_reproduction.py' -v
      - name: Verify real parity against original reference (read only AST)
        working-directory: revue
        run: python -m outils.verifier_parite_clairvoyance --reference ../clairvoyance_reference --output docs/parite-clairvoyance-predictor.json
      - name: Compare original NHL predictor with observed Revue fixture inputs (not original data)
        working-directory: revue
        run: |
          python -m unittest discover -s tests -p 'test_parite_predictor_nhl_observe.py' -v
          python -m outils.verifier_parite_predictor_nhl_observe --reference ../clairvoyance_reference --output docs/parite-clairvoyance-nhl-observe.json docs/parite-nhl-espn-id-map.json
      - name: Match source ESPN NHL IDs against official NHL calendar by teams and exact kickoff
        working-directory: revue
        run: |
          python -m unittest discover -s tests -p 'test_parite_calendrier_nhl_espn.py' -v
          python -m outils.parite_calendrier_nhl_espn --reference ../clairvoyance_reference
      - name: Comparer quatre fonctions NBA au code Clairvoyance d'origine
        working-directory: revue
        run: python -m outils.verifier_parite_nba_source --reference ../clairvoyance_reference --output docs/parite-clairvoyance-nba-source.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier les fonctions JavaScript originales sur mêmes entrées
        working-directory: revue
        run: node outils/verify_clairvoyance_frontend.js ../clairvoyance_reference docs/parite-clairvoyance-frontend.json
      - name: Check the strict model parity progress measurement
        working-directory: revue
        run: python -m unittest discover -s tests -p 'test_catalogue_parite_modeles.py' -v
      - name: Regenerate the 13-model strict reproduction scoreboard
        working-directory: revue
        run: python -m outils.catalogue_parite_modeles
      - name: Publish ONLY equality metadata, not third-party code
        working-directory: revue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/parite-clairvoyance-predictor.json docs/parite-clairvoyance-frontend.json docs/parite-modeles-clairvoyance.json docs/parite-clairvoyance-nba-source.json docs/parite-clairvoyance-nhl-observe.json
          if ! git diff --cached --quiet; then
            git commit -m "parity: verify original Clairvoyance backend MLB and NHL models"
            # Data-refresh workflows may push at the same time. Retry the
            # non-force update; never overwrite concurrent commits.
            for attempt in 1 2 3 4 5; do
              git pull --rebase -X theirs origin main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep $((attempt * 2))
            done
            echo "Parity metadata could not be pushed after safe retries" >&2
            exit 1
          fi
