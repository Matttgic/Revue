name: Revue - NHL official results only

on:
  workflow_dispatch:
  schedule:
    # Score-only settlement every four hours, independent of MoneyPuck refresh.
    - cron: '15 0,4,8,12,16,20 * * *'
  push:
    paths:
      - 'outils/nhl_settlement_officiel.py'
      - 'outils/nhl_shadow_tracker.py'
      - 'outils/nhl_calibration_prospective.py'
      - 'tests/test_nhl_settlement_officiel.py'
      - 'tests/test_nhl_calibration_prospective.py'
      - '.github/workflows/nhl-settlement-officiel.yml'

permissions:
  contents: write

# Share one concurrency group with the forecasting workflow; both commit
# to the same prospective ledger, so they must not write simultaneously.
concurrency:
  group: revue-nhl-clairvoyance-shadow
  cancel-in-progress: false

jobs:
  settle-locked-games:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove scoreboard handling and immutable comparison
        run: |
          python -m unittest discover -s tests -p 'test_nhl_settlement_officiel.py' -v
          python -m unittest discover -s tests -p 'test_nhl_shadow_tracker.py' -v
          python -m unittest discover -s tests -p 'test_nhl_calibration_prospective.py' -v
      - name: Verify prospective ledger exists
        run: test -s docs/nhl-shadow-ledger.json
      - name: Grade only genuine completed matches on the newest ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            # The scorer never generates new probabilities. It does nothing
            # when the official games are not yet final or are already graded.
            python -m outils.nhl_settlement_officiel
            # Rebuild research validation only when new official results arrive
            # (or when first installed); do not fabricate results or churn git.
            if ! git diff --quiet -- docs/nhl-shadow-ledger.json || ! test -s docs/nhl-calibration-latest.json; then
              python -m outils.nhl_calibration_prospective
            fi
            git add docs/nhl-shadow-ledger.json docs/nhl-shadow-performance.json docs/nhl-calibration-latest.json
            if git diff --cached --quiet; then
              echo "No newly settled official result"
              exit 0
            fi
            git commit -m "data(nhl): settle locked forecasts with official NHL final scores"
            if git push origin HEAD:main; then exit 0; fi
            echo "Concurrent result publication detected; retrying from fresh ledger"
            sleep "$attempt"
          done
          exit 1
