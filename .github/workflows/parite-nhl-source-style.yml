name: Revue - NHL original backend source-style parity
on:
  workflow_dispatch:
  schedule:
    - cron: '35 14 * * 1'  # Audit Clairvoyance hebdomadaire (lundi) : le source ne change pas au jour le jour.
  push:
    branches: [main]
    paths:
      - 'outils/clairvoyance/verifier_parite_nhl_source_style.py'
      - 'outils/clairvoyance/nhl_backend_source_style.py'
      - 'tests/test_nhl_backend_source_style.py'
      - '.github/workflows/parite-nhl-source-style.yml'
permissions:
  contents: write
concurrency:
  group: revue-nhl-source-style-original-comparison
  cancel-in-progress: false
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          path: revue
      - uses: actions/checkout@v4
        with:
          repository: Purple-Wraith/clairvoyance-backend
          persist-credentials: false
          path: reference
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify independent NHL input protection
        working-directory: revue
        run: python -m unittest discover -s tests -p 'test_nhl_backend_source_style.py' -v
      - name: Compare real NHL scenarios with original predictor, without copying its code
        working-directory: revue
        run: |
          python -m outils.clairvoyance.verifier_parite_nhl_source_style --reference ../reference \
            --input docs/nhl-backend-source-style-latest.json \
            --output docs/parite-nhl-source-style.json
      - name: Publish output comparison metadata only
        working-directory: revue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/parite-nhl-source-style.json
          if ! git diff --cached --quiet; then
            git commit -m "parity(nhl): compare observed source-style inputs to original backend"
            for attempt in 1 2 3 4; do
              git pull --rebase -X theirs origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep "$attempt"
            done
            exit 1
          fi
