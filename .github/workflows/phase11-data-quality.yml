name: Revue - Phase 11 Data Integrity
on:
  workflow_dispatch:
  schedule:
    - cron: '25 1,7,13,19 * * *'
  workflow_run:
    workflows:
      - 'Revue - Match Center unifié'
      - 'Revue - NHL ESPN gardiens observes'
    types: [completed]
  push:
    paths:
      - 'outils/controles/phase11_data_quality.py'
      - 'outils/collecte/mlb_official_pitchers.py'
      - 'tests/test_mlb_official_pitchers.py'
      - 'tests/test_phase11_data_quality.py'
      - 'docs/phase11-donnees.html'
      - 'docs/phase11-data.js'
      - 'tests/test_phase11_site.py'
      - '.github/workflows/phase11-data-quality.yml'
permissions:
  contents: write
concurrency:
  group: revue-phase11-sources
  cancel-in-progress: false
jobs:
  audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify ESPN lineups and quarantine paper market rules
        run: |
          python -m unittest discover -s tests -p 'test_phase11_data_quality.py' -v
          python -m unittest discover -s tests -p 'test_mlb_official_pitchers.py' -v
          python -m unittest discover -s tests -p 'test_phase11_site.py' -v
          python -m unittest discover -s tests -p 'test_match_center_revue.py' -v
          python -m unittest discover -s tests -p 'test_nhl_espn_goalies.py' -v
      - name: Re-evaluate saved observations without paid APIs
        env:
          ODDS_API_KEY: ''
          PULSESCORE_API_KEY: ''
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python -m outils.collecte.mlb_official_pitchers
            python -m outils.controles.phase11_data_quality
            git add docs/phase11-source-quality-latest.json docs/mlb-official-probable-pitchers-latest.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'audit(phase11): update bookmaker exclusion and multisport input evidence'
            if git push origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          exit 1
