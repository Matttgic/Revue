name: Revue - Arcade V3 source-gated UX
on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/index.html'
      - 'docs/arcade-v3.css'
      - 'docs/arcade-v3-data.js'
      - 'docs/arcade-v3-app.js'
      - 'docs/retro.css'
      - 'docs/retro-app.js'
      - 'tests/test_arcade_v3_data.js'
      - 'tests/test_arcade_v3_site.py'
      - '.github/workflows/arcade-v3-tests.yml'
permissions:
  contents: write
concurrency:
  group: revue-arcade-v3-qa
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run behavioral checks on real historical snapshots and adversarial data
        run: node --test tests/test_arcade_v3_data.js
      - name: Verify mobile structure, links, asset syntax and source provenance
        run: python -m unittest discover -s tests -p 'test_arcade_v3_site.py' -v
      - name: Verify existing Arena routes still conform to contract
        run: python -m unittest discover -s tests -p 'test_site_arena.py' -v
      - name: Publish QA record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            node --test tests/test_arcade_v3_data.js
            python -m unittest discover -s tests -p 'test_arcade_v3_site.py'
            python - <<'PY'
          import json
          from datetime import datetime,timezone
          from pathlib import Path
          p=Path('docs/arcade-v3-qa.json')
          out={
              'generated_at_utc':datetime.now(timezone.utc).isoformat(),
              'status':'verified_static_ui_and_data_model',
              'screens':['A JOUER','POURQUOI','BILAN'],
              'data_sources':['match-center-latest.json','picks-center-latest.json',
                              'nhl-frontend-observed-latest.json'],
              'real_bets_enabled':False,
              'live_bookmaker_prices_verified':False,
              'original_clairvoyance_predictions_verified':False,
              'functional_coverage_percent_not_raised':True,
              'behavior_tests_passed':True,
              'mobile_structural_checks_passed':True,
              'existing_pages_checked':True,
              'no_deployment_readiness_claim':True,
          }
          p.write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
            git add docs/arcade-v3-qa.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "qa(arcade): verify simpler WHAT WHY BILAN site and no fake prices"
            if git push origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          exit 1
