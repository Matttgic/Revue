name: Revue - Parité des données sportives Clairvoyance
on:
  workflow_dispatch:
  schedule:
    - cron: '35 5 * * *'
  push:
    paths:
      - 'outils/audit_entrees_clairvoyance.py'
      - 'tests/test_audit_entrees_clairvoyance.py'
      - '.github/workflows/audit-donnees-clairvoyance.yml'
permissions:
  contents: write
concurrency:
  group: revue-audit-donnees-clairvoyance
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tester qu'aucune donnée absente n'est inventée
        run: python -m unittest discover -s tests -p 'test_audit_entrees_clairvoyance.py' -v
      - name: Comparer la disponibilité des données réellement observées
        run: python -m outils.audit_entrees_clairvoyance
      - name: Publier uniquement le statut dérivé de la couverture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/parite-donnees-clairvoyance.json
          if ! git diff --cached --quiet; then
            git commit -m "audit: statuts de sources observées, distincts de parité des formules"
            for attempt in 1 2 3 4; do
              git pull --rebase -X theirs origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep "$attempt"
            done
            exit 1
          fi
