name: Revue - Publier site mobile
on:
  workflow_dispatch:
  # GITHUB_TOKEN commits from the data scanner do not trigger push workflows.
  # Periodically republish its stored real prices without any new API call.
  schedule:
    - cron: '30 0,6,12,18 * * *'
  # An automatic MoneyPuck GITHUB_TOKEN commit does not trigger a push deploy.
  # This event runs after that workflow completes and checks out latest main.
  workflow_run:
    workflows:
      - 'Revue - MoneyPuck official NHL data'
      - 'Revue - Clairvoyance NHL MoneyPuck Shadow'
      - 'Revue - NHL ESPN gardiens observes'
      - 'Revue - NHL Monte Carlo Ensemble prospective'
      - 'Revue - NHL frontend MC et Ensemble observes'
      - 'Revue - Match Center unifié'
      - 'Revue - Donnees prioritaires et reglements'
      - 'Revue - Radar PulseScore 6h'
      - 'Revue - Export Control Center statique'
      - 'Revue - Historique executions CI'
      - 'Revue - Picks Center fonctionnel'
      - 'Revue - Multisports Independent'
      - 'Revue - Suivi individuel officiel'
      - 'Revue - Hockey européen source'
      - 'Revue - Sorties reelles Clairvoyance'
      - 'Revue - Diagnostic NHL entrees originales'
      - 'Revue - Phase 1 fidelite NHL'
      - 'Revue - Phase 2 Historique Autonome'
      - 'Revue - Phase 7 PulseScore quote integrity and paper audit'
      - 'Revue - Phase 9 Production Acceptance'
      - 'Revue - Phase 6 Original Predictions'
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tests/test_site_arena.py'
      - '.github/workflows/deploy-pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: revue-pages
  cancel-in-progress: true
jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier navigation et exclusion CFB avant la publication
        run: |
          python -m unittest discover -s tests -p 'test_site_arena.py' -v
          python -m unittest discover -s tests -p 'test_phase1_nhl_site.py' -v
          python -m unittest discover -s tests -p 'test_phase2_site.py' -v
          python -m unittest discover -s tests -p 'test_phase8_site.py' -v
          python -m unittest discover -s tests -p 'test_arcade_v3_site.py' -v
          node --test tests/test_arcade_v3_data.js tests/test_arcade_v3_radar.js tests/test_arcade_v3_phase3.js tests/test_arcade_v3_phase3_guardrails.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test deployed public pages and static JS
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import os,time
          from urllib.request import Request,urlopen
          from urllib.error import URLError
          root=os.environ['PAGE_URL'].rstrip('/')
          assert root.startswith('https://matttgic.github.io/Revue')
          checks={
            '/index.html':b'GAME',
            '/play.html':b'play-results',
            '/pourquoi.html':b'v3-explain',
            '/bilan.html':b'bilan-profit',
            '/phase8-ui.css':b'phase8-why-hero',
            '/arcade-v3-data.js':b'RevueArcadeV3',
          }
          for path,marker in checks.items():
              last_error=None
              for attempt in range(5):
                  try:
                      request=Request(root+path,headers={'User-Agent':'Revue-Phase9-Pages-Smoke/1.0'})
                      with urlopen(request,timeout=20) as response:
                          assert response.status==200
                          payload=response.read(3000000)
                      assert marker in payload,(path,marker)
                      print('Public route confirmed:',path,len(payload))
                      break
                  except (URLError,AssertionError,TimeoutError) as e:
                      last_error=e
                      if attempt<4:time.sleep(5)
              else:raise RuntimeError(f'Pages HTTP smoke failed for {path}: {last_error}')
          PY
