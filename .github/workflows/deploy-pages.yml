name: Revue - Publier site mobile
on:
  workflow_dispatch:
  # GITHUB_TOKEN commits from the data scanner do not trigger push workflows.
  # Periodically republish its stored real prices without any new API call.
  schedule:
    - cron: '30 0,6,12,18 * * *'
  # An automatic MoneyPuck GITHUB_TOKEN commit does not trigger a push deploy.
  # This event runs after that workflow completes and checks out latest main.
  workflow_run:
    workflows:
      - 'Revue - MoneyPuck official NHL data'
      - 'Revue - Clairvoyance NHL MoneyPuck Shadow'
      - 'Revue - Match Center unifié'
      - 'Revue - Export Control Center statique'
      - 'Revue - Historique executions CI'
      - 'Revue - Picks Center fonctionnel'
      - 'Revue - Multisports Independent'
      - 'Revue - Suivi individuel officiel'
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tests/test_site_arena.py'
      - '.github/workflows/deploy-pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: revue-pages
  cancel-in-progress: true
jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier navigation et exclusion CFB avant la publication
        run: python -m unittest discover -s tests -p 'test_site_arena.py' -v
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - id: deployment
        uses: actions/deploy-pages@v4
