name: Revue - Inspection limitée fonctions JS Clairvoyance
on:
  workflow_dispatch:
  push:
    paths:
      - 'outils/inspecter_fonctions_clairvoyance.py'
      - '.github/workflows/inspecter-fonctions-clairvoyance.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          path: revue
      - uses: actions/checkout@v4
        with:
          repository: Purple-Wraith/clairvoyance-backend
          path: reference
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspecter signatures et courts segments des fonctions JS
        working-directory: revue
        run: python -m outils.inspecter_fonctions_clairvoyance --source ../reference/docs/app.html --only _hkBlendAlpha _hkValidDec HOCKEY_MKT_BLEND_ALPHA HOCKEY_MKT_BLEND_FULL_GP HOCKEY_MKT_BLEND_ALPHA_EARLY _HK_MKT_OVERROUND_MIN _HK_MKT_OVERROUND_MAX _HK_MKT_PMIN _HK_MKT_PMAX --limit 1100
